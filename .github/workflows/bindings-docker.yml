name: Docker Prover CI

on:
  workflow_call:
    inputs:
      push_image:
        description: 'Whether to push the image to GHCR'
        required: false
        type: boolean
        default: false
      ref_name:
        description: 'Reference name (branch or tag)'
        required: false
        type: string
        default: ''
      ref_type:
        description: 'Reference type (branch or tag)'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  packages: write

# Node 24 (default since 2026-06-16) trusts only its bundled Mozilla CA store.
# Some GitHub-hosted runners present a TLS chain that is trusted by the OS CA
# store but not by that Mozilla snapshot, which makes GitHub API calls from
# JS actions fail with: "self-signed certificate; ... try --use-system-ca".
env:
  NODE_OPTIONS: --use-system-ca

jobs:

  docker-prover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history + tags so `git describe` can resolve the real version.
          # The Docker build context has no .git (not COPYed), so CMake cannot
          # derive C4_VERSION itself.
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          VERSION="$(git describe --tags --always --dirty)"
          echo "Using C4_VERSION=$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: ${{ inputs.push_image }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/corpus-core/colibri-prover
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ inputs.ref_type == 'tag' && startsWith(inputs.ref_name, 'v') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: bindings/docker/Dockerfile
          build-args: |
            C4_VERSION=${{ steps.version.outputs.version }}
          # Multi-platform only for releases, single platform for dev/main/PRs (faster)
          platforms: ${{ inputs.ref_type == 'tag' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ inputs.push_image }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=prover
          cache-to: type=gha,mode=max,scope=prover
          # Disable provenance/attestation to avoid GHCR upload issues
          provenance: false
          sbom: false

  docker-verifier:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history + tags so `git describe` can resolve the real version.
          # The Docker build context has no .git (not COPYed), so CMake cannot
          # derive C4_VERSION itself.
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          VERSION="$(git describe --tags --always --dirty)"
          echo "Using C4_VERSION=$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: ${{ inputs.push_image }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/corpus-core/colibri-verifier
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ inputs.ref_type == 'tag' && startsWith(inputs.ref_name, 'v') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: bindings/docker/Dockerfile.verifier
          build-args: |
            C4_VERSION=${{ steps.version.outputs.version }}
          # Multi-platform only for releases, single platform for dev/main/PRs (faster)
          platforms: ${{ inputs.ref_type == 'tag' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ inputs.push_image }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=verifier
          cache-to: type=gha,mode=max,scope=verifier
          # Disable provenance/attestation to avoid GHCR upload issues
          provenance: false
          sbom: false

  docker-kona-bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: ${{ inputs.push_image }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/corpus-core/colibri-kona-bridge
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ inputs.ref_type == 'tag' && startsWith(inputs.ref_name, 'v') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: src/chains/op/kona_bridge
          file: src/chains/op/kona_bridge/Dockerfile
          # Multi-platform only for releases, single platform for dev/main/PRs (faster)
          platforms: ${{ inputs.ref_type == 'tag' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ inputs.push_image }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=kona-bridge
          cache-to: type=gha,mode=max,scope=kona-bridge
          # Disable provenance/attestation to avoid GHCR upload issues
          provenance: false
          sbom: false
