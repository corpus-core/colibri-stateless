name: Rust CI

on:
  workflow_call:
    secrets:
      CARGO_REGISTRY_TOKEN:
        required: false

permissions:
  contents: write
  checks: write
  pull-requests: write
  actions: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: colibri-native-x86_64-unknown-linux-gnu.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: colibri-native-aarch64-apple-darwin.tar.gz
          # macos-13 was retired on 2025-12-04; macos-15-intel is the
          # last GitHub-hosted x86_64 macOS image (until August 2027).
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: colibri-native-x86_64-apple-darwin.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: colibri-native-x86_64-pc-windows-msvc.tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            bindings/rust/target
          key: cargo-${{ matrix.target }}-${{ hashFiles('bindings/rust/Cargo.toml', 'bindings/rust/Cargo.lock') }}
          restore-keys: |
            cargo-${{ matrix.target }}-

      - name: Install Build Dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - name: Install Build Dependencies (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          if ! command -v cmake &> /dev/null; then
            brew install cmake
          fi

      - name: Install Build Dependencies (Windows)
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: |
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
          cmake --version

      - name: Setup MSBuild (Windows)
        if: matrix.os == 'windows-latest'
        uses: microsoft/setup-msbuild@v2

      # The vendored CMake dependencies (evmone + its recursive
      # submodules) create paths well beyond Windows' 260-character
      # MAX_PATH limit, which makes `git clone` fail with
      # "Filename too long". build.rs already keeps the CMake tree in a
      # short, deterministic directory; this removes the remaining
      # headroom problem for good.
      - name: Enable Git long paths (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          git config --global core.longpaths true
          # `--system` needs elevation; runners have it, but don't fail
          # the job if a future image drops that privilege.
          git config --system core.longpaths true 2>$null
          git config --global --get core.longpaths
          exit 0

      # cmd.exe cannot cope with an environment whose PATH exceeds 8191
      # characters (KB 830473): blst's build.bat dies with "The input
      # line is too long" when it prepends system32 to %PATH%. The
      # default runner PATH plus the Rust toolchain, MSBuild and choco
      # additions crosses that limit, so replace it with a short curated
      # list for all following steps. rustc, the cc crate and CMake
      # locate MSVC through vswhere/registry, not PATH.
      - name: Shorten PATH (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Write-Host "PATH length before: $($env:PATH.Length)"
          $keep = @(
            "$env:USERPROFILE\.cargo\bin",
            "$env:SystemRoot\system32",
            "$env:SystemRoot",
            "$env:SystemRoot\System32\WindowsPowerShell\v1.0",
            "$env:ProgramFiles\PowerShell\7",
            "$env:ProgramFiles\CMake\bin",
            "$env:ProgramFiles\Git\cmd"
          )
          # Keep toolchain entries the actions above put on PATH.
          $dynamic = ($env:PATH -split ';') | Where-Object { $_ -match 'MSBuild|Visual Studio|Python' }
          $newPath = (($keep + $dynamic) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -Unique) -join ';'
          Write-Host "PATH length after: $($newPath.Length)"
          Write-Host $newPath
          "PATH=$newPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Extract version from Git tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        working-directory: bindings/rust
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "Setting Cargo.toml version to $VERSION"
          python3 - <<PY
          import re, pathlib
          p = pathlib.Path("Cargo.toml")
          txt = p.read_text()
          txt = re.sub(r'^version\s*=\s*".*"', f'version = "$VERSION"', txt, count=1, flags=re.M)
          p.write_text(txt)
          PY
          grep '^version' Cargo.toml

      - name: cargo fmt --check
        if: matrix.os == 'ubuntu-latest'
        working-directory: bindings/rust
        run: cargo fmt --all -- --check

      - name: cargo clippy
        if: matrix.os == 'ubuntu-latest'
        working-directory: bindings/rust
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo build (release)
        working-directory: bindings/rust
        shell: bash
        run: cargo build --release --target ${{ matrix.target }}

      - name: cargo test (release)
        working-directory: bindings/rust
        shell: bash
        # `--test-threads=1` -- storage plugin is global; the shipped
        # tests are already `#[serial]`, but this keeps the corpus
        # stable across future test additions.
        run: cargo test --release --target ${{ matrix.target }} -- --test-threads=1

      - name: Package Native Archive
        if: matrix.os != 'windows-latest'
        shell: bash
        working-directory: bindings/rust
        run: |
          set -euo pipefail
          mkdir -p native-out/${{ matrix.target }}/{lib,include}

          # Collect every static archive produced by the CMake build.
          # build.rs builds into <repo>/build-rust/<target>/build.
          BUILD_DIR="../../build-rust/${{ matrix.target }}/build"
          if [ ! -d "$BUILD_DIR" ]; then
            echo "CMake build directory not found at $BUILD_DIR"
            ls -la ../../ || true
            exit 1
          fi
          echo "Using CMake build dir: $BUILD_DIR"

          find "$BUILD_DIR" -name '*.a' -exec cp {} native-out/${{ matrix.target }}/lib/ \;

          # The unified-RPC wrapper (bindings/colibri.c) is compiled by the
          # cc crate inside build.rs, so its archive lives in cargo's
          # OUT_DIR, not in the CMake tree. Without it the published crate
          # fails to link (c4_rpc_* symbols missing).
          WRAPPER=$(find target/${{ matrix.target }}/release/build -name 'libcolibri_wrapper.a' | head -1)
          if [ -z "$WRAPPER" ]; then
            echo "libcolibri_wrapper.a not found under target/${{ matrix.target }}/release/build"
            exit 1
          fi
          cp "$WRAPPER" native-out/${{ matrix.target }}/lib/

          cp ../colibri.h native-out/${{ matrix.target }}/include/
          cp ../colibri_common.h native-out/${{ matrix.target }}/include/ 2>/dev/null || true

          tar -czf ${{ matrix.asset }} -C native-out/${{ matrix.target }} .

          # SHA-256 sidecar for build.rs to verify against.
          if command -v sha256sum >/dev/null; then
            sha256sum ${{ matrix.asset }} > ${{ matrix.asset }}.sha256
          else
            shasum -a 256 ${{ matrix.asset }} > ${{ matrix.asset }}.sha256
          fi
          ls -la ${{ matrix.asset }}*

      - name: Package Native Archive (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        working-directory: bindings/rust
        run: |
          $target = "${{ matrix.target }}"
          $out    = "native-out/$target"
          New-Item -ItemType Directory -Force -Path "$out/lib"     | Out-Null
          New-Item -ItemType Directory -Force -Path "$out/include" | Out-Null

          # build.rs builds into <repo>/build-rust/<target>/build.
          $buildDir = "../../build-rust/$target/build"
          if (-not (Test-Path $buildDir)) {
            Write-Host "CMake build directory not found at $buildDir"
            exit 1
          }
          Write-Host "Using CMake build dir: $buildDir"

          Get-ChildItem -Path $buildDir -Recurse -Include *.lib,*.a `
            | ForEach-Object { Copy-Item $_.FullName "$out/lib/" }

          # The unified-RPC wrapper (bindings/colibri.c) is compiled by the
          # cc crate inside build.rs, so its archive lives in cargo's
          # OUT_DIR, not in the CMake tree.
          $wrapper = Get-ChildItem -Path "target/$target/release/build" -Recurse `
            -Include colibri_wrapper.lib,libcolibri_wrapper.a | Select-Object -First 1
          if (-not $wrapper) {
            Write-Host "colibri_wrapper archive not found under target/$target/release/build"
            exit 1
          }
          Copy-Item $wrapper.FullName "$out/lib/"

          Copy-Item "../colibri.h"        "$out/include/"
          Copy-Item "../colibri_common.h" "$out/include/" -ErrorAction SilentlyContinue

          tar -czf "${{ matrix.asset }}" -C $out .

          $hash = (Get-FileHash "${{ matrix.asset }}" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.asset }}" | Out-File -Encoding ASCII -NoNewline "${{ matrix.asset }}.sha256"

          Get-ChildItem "${{ matrix.asset }}*"

      - name: Upload Native Archive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-native-${{ matrix.target }}
          path: |
            bindings/rust/${{ matrix.asset }}
            bindings/rust/${{ matrix.asset }}.sha256
          if-no-files-found: error

  publish-release-assets:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Native Archives
        uses: actions/download-artifact@v4
        with:
          pattern: rust-native-*
          path: native-archives/
          merge-multiple: true

      - name: Upload to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Uploading native archives to release ${GITHUB_REF#refs/tags/}"
          ls -la native-archives/

          for asset in native-archives/*; do
            echo "Uploading $asset"
            gh release upload "${GITHUB_REF#refs/tags/}" "$asset" --clobber
          done

  publish-crate:
    needs: publish-release-assets
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Set crate version from Git tag
        working-directory: bindings/rust
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "Setting Cargo.toml version to $VERSION"
          python3 - <<PY
          import re, pathlib
          p = pathlib.Path("Cargo.toml")
          txt = p.read_text()
          txt = re.sub(r'^version\s*=\s*".*"', f'version = "$VERSION"', txt, count=1, flags=re.M)
          p.write_text(txt)
          PY
          grep '^version' Cargo.toml

      - name: cargo package (dry-run)
        working-directory: bindings/rust
        env:
          # Skip the native build during `cargo package` -- the crate on
          # crates.io downloads prebuilt archives at build time.
          COLIBRI_SKIP_NATIVE: "1"
        run: cargo package --allow-dirty --no-verify

      - name: cargo publish
        if: env.CARGO_REGISTRY_TOKEN != ''
        working-directory: bindings/rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          COLIBRI_SKIP_NATIVE: "1"
        run: cargo publish --allow-dirty --no-verify
