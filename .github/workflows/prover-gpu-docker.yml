name: Docker Prover GPU (RunPod)

# Builds and pushes the RunPod GPU-prover image to GHCR.
#
# This is a temporary, branch-local pipeline: the v5 pod solution lives only on
# the `v5_pod` branch and is intentionally NOT merged into dev/main (the main
# branches already produce v6 proofs via the SP1 prover network). We therefore
# drive the build purely from pushes to `v5_pod` - no default-branch presence
# and no version tag required:
#
#   * A `workflow_dispatch` / `gh workflow run` trigger would need this file on
#     the default branch (`dev`), which we explicitly want to avoid.
#   * A `push` trigger uses the workflow file of the pushed branch, so keeping
#     it on `v5_pod` alone is enough.
#
# To (re)deploy: commit to `v5_pod` and push. To force a rebuild without source
# changes, push an empty commit:
#
#   git commit --allow-empty -m "rebuild prover-gpu image" && git push
#
# RunPod pods run x86_64 with NVIDIA CUDA, so we only build linux/amd64.

on:
  push:
    branches:
      - v5_pod

permissions:
  contents: read
  packages: write

concurrency:
  group: prover-gpu-docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker-prover-gpu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/corpus-core/colibri-prover-gpu
          tags: |
            type=raw,value=latest
            type=ref,event=branch
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/chains/eth/zk_proof/runpod/prover-gpu/Dockerfile
          # RunPod GPU nodes are all x86_64 - single-arch keeps the image
          # small (~5-6 GB) and the build under 30 min on a GH runner.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=prover-gpu
          cache-to: type=gha,mode=max,scope=prover-gpu
          provenance: false
          sbom: false
