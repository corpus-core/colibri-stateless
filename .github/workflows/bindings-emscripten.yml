name: Emscripten CI

on:
  workflow_call:
    secrets:
      NPM_TOKEN:
        required: false

permissions:
  contents: write # Required for creating releases and uploading assets
  checks: write
  pull-requests: write
  actions: read

jobs:

  emscripten:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.3

      - name: Build with Emscripten (Split WASM for npm)
        run: |
          emcmake cmake -B build -DWASM=true -DWASM_EMBED=OFF -DCLI=false -DTEST=false -DCURL=false -DCMAKE_BUILD_TYPE=MINSIZREL -S .
          cmake --build build

      - name: Run unit tests (node) + webpack build
        run: |
          cd bindings/emscripten
          npm test
          cd ../../

      - name: Run integration tests (real infrastructure)
        run: |
          cd bindings/emscripten
          npm run test:integration
          cd ../../

      - name: RN-web smoke (Expo) tests
        run: |
          cd bindings/emscripten/rn-web-test
          npm install
          npm test
          npm run build:web
        env:
          EXPO_NO_TELEMETRY: "1"
          NODE_OPTIONS: "--experimental-vm-modules --preserve-symlinks"
          NODE_PATH: "./node_modules"

      - name: Create WASM Package
        run: |
          cd build/emscripten
          zip -r ../../colibri-wasm.zip ./*
          cd ../..

      - name: Upload WASM
        uses: actions/upload-artifact@v4
        with:
          name: c4-wasm
          path: colibri-wasm.zip

      - name: Set package version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          echo "Setting version to $TAG_VERSION in package.json"
          npm version $TAG_VERSION --no-git-tag-version
        working-directory: build/emscripten

      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        working-directory: build/emscripten

      # --- colibri-thor: Build, Test, Version, Publish ---

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Cache Arti build
        uses: actions/cache@v4
        with:
          path: |
            bindings/emscripten/thor/.arti-build
            ~/.cargo/registry
            ~/.cargo/git
          key: arti-wasm-${{ hashFiles('bindings/emscripten/thor/scripts/build-arti.sh') }}
          restore-keys: arti-wasm-

      - name: Build tor-js from source
        run: bash scripts/build-arti.sh
        working-directory: bindings/emscripten/thor

      - name: Build colibri-thor
        run: npx tsc
        working-directory: bindings/emscripten/thor

      - name: Test colibri-thor
        run: |
          cd bindings/emscripten/thor
          npm test

      - name: Set colibri-thor version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          echo "Setting colibri-thor version to $TAG_VERSION"
          npm version $TAG_VERSION --no-git-tag-version
        working-directory: bindings/emscripten/thor

      - name: Publish colibri-thor to npm
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        working-directory: bindings/emscripten/thor
