name: Emscripten CI

on:
  workflow_call:
    inputs:
      push_image:
        description: 'Whether to push the playground image to GHCR'
        required: false
        type: boolean
        default: false
      ref_name:
        description: 'Reference name (branch or tag)'
        required: false
        type: string
        default: ''
      ref_type:
        description: 'Reference type (branch or tag)'
        required: false
        type: string
        default: ''
    secrets:
      NPM_TOKEN:
        required: false

permissions:
  contents: write # Required for creating releases and uploading assets
  checks: write
  pull-requests: write
  actions: read
  packages: write # Required for pushing the playground Docker image to GHCR

jobs:

  # Builds the self-contained native Node.js addon (statically linked C library
  # with platform-optimized blst assembly) for every supported platform. The
  # resulting prebuilds are bundled into the npm package by the emscripten job.
  native_addon:
    name: Native addon ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64,    os: ubuntu-latest }
          - { name: linux-arm64,  os: ubuntu-24.04-arm }
          - { name: darwin-arm64, os: macos-latest }
          - { name: darwin-x64,   os: macos-15-intel }
          - { name: win32-x64,    os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Enable Git long paths (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The vendored CMake dependencies (evmone + recursive submodules) exceed
          # Windows' 260-character MAX_PATH limit during FetchContent clone.
          git config --global core.longpaths true
          git config --system core.longpaths true 2>$null
          exit 0

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history + tags so `git describe` can resolve the real version
          # for the proof-gate logic in "Determine version".
          fetch-depth: 0

      - name: Setup MSBuild (Windows)
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Determine version
        id: version
        shell: bash
        run: |
          # Clients below 3.0.0 are forwarded to the v2 prover, whose SSZ proofs
          # a 3.x client cannot verify. Keep a real 3.x describe; only a missing
          # or pre-3 version is rewritten to 3.0.0.
          VERSION="$(git describe --tags --always --dirty)"
          if printf '%s' "$VERSION" | grep -Eq '^[vV]?[0-9]+\.[0-9]+'; then
            MAJOR="$(printf '%s' "$VERSION" | sed -E 's/^v//; s/[^0-9].*$//')"
          else
            MAJOR=""
          fi
          if [ -z "$MAJOR" ] || [ "$MAJOR" -lt 3 ]; then
            echo "git describe gave '$VERSION' (major='$MAJOR'); forcing C4_VERSION=3.0.0"
            VERSION="3.0.0"
          fi
          echo "Using C4_VERSION=$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build native addon
        shell: bash
        run: |
          # Short build dir ("na") keeps the deep evmone FetchContent paths
          # below Windows' MAX_PATH limit.
          cmake -S . -B build/na -DCMAKE_BUILD_TYPE=Release -DNODE_ADDON=1 -DCHAIN_OP=ON
          cmake --build build/na --config Release --parallel --target colibri_native
        env:
          C4_VERSION: ${{ steps.version.outputs.version }}

      - name: Assemble prebuild + smoke test
        shell: bash
        run: |
          TARGET="$(node -p 'process.platform + "-" + process.arch')"
          if [ "$TARGET" != "${{ matrix.name }}" ]; then
            echo "runner target $TARGET does not match matrix entry ${{ matrix.name }}" >&2
            exit 1
          fi
          mkdir -p "prebuilds/$TARGET"
          # Multi-config generators (MSVC) place the output in a Release/ subdir.
          NODE_FILE="$(find build/na/node-addon -name 'colibri_native.node' | head -1)"
          cp "$NODE_FILE" "prebuilds/$TARGET/"
          node -e "
            const b = require('./prebuilds/' + process.platform + '-' + process.arch + '/colibri_native.node');
            if (b.getMethodType(1n, 'eth_getTransactionByHash', null, 0) !== 1) throw new Error('unexpected method type');
            console.log('native addon OK, version 0x' + b.version().toString(16));
          "

      - name: Upload prebuild
        uses: actions/upload-artifact@v4
        with:
          name: c4-native-${{ matrix.name }}
          path: prebuilds/
          if-no-files-found: error

  emscripten:
    runs-on: ubuntu-latest
    needs: native_addon
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history + tags so `git describe` can resolve the real version
          # for the proof-gate logic in "Determine version".
          fetch-depth: 0

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.3

      - name: Download native addon prebuilds
        uses: actions/download-artifact@v4
        with:
          pattern: c4-native-*
          path: native-prebuilds
          merge-multiple: true

      - name: Determine version
        id: version
        run: |
          # The WASM build bakes this version in and colibri reports it to the
          # remote prover. Clients below 3.0.0 are forwarded to the v2 prover
          # (see c4_try_forward_legacy_proof); that SSZ layout is incompatible
          # with this client, so verification fails immediately.
          #
          # Keep a real 3.x `git describe`. Only a missing or pre-3 version is
          # rewritten to 3.0.0, so a shallow checkout still requests a 3.x proof.
          VERSION="$(git describe --tags --always --dirty)"
          if printf '%s' "$VERSION" | grep -Eq '^[vV]?[0-9]+\.[0-9]+'; then
            MAJOR="$(printf '%s' "$VERSION" | sed -E 's/^v//; s/[^0-9].*$//')"
          else
            MAJOR=""
          fi
          if [ -z "$MAJOR" ] || [ "$MAJOR" -lt 3 ]; then
            echo "git describe gave '$VERSION' (major='$MAJOR'); forcing C4_VERSION=3.0.0"
            VERSION="3.0.0"
          fi
          echo "Using C4_VERSION=$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build with Emscripten (Split WASM for npm)
        run: |
          emcmake cmake -B build -DWASM=true -DWASM_EMBED=OFF -DCLI=false -DTEST=false -DCURL=false -DCHAIN_OP=ON -DCMAKE_BUILD_TYPE=MINSIZREL -DC4W_PREBUILDS_DIR=$GITHUB_WORKSPACE/native-prebuilds -S .
          cmake --build build
        env:
          C4_VERSION: ${{ steps.version.outputs.version }}

      - name: Run unit tests (node) + webpack build
        run: |
          cd bindings/emscripten
          npm test
          cd ../../

      - name: Run unit tests against native addon
        run: |
          cd bindings/emscripten
          npm run test:node:native
          cd ../../

#      - name: Run integration tests (real infrastructure)
#        run: |
#          cd bindings/emscripten
#          npm run test:integration
#          cd ../../

#      - name: Run CCIP tests (real infrastructure)
#        run: |
#          cd bindings/emscripten
#          npm run test:ccip
#          cd ../../
  
      - name: RN-web smoke (Expo) tests
        run: |
          cd bindings/emscripten/test/rn-web
          npm install
          npm test
          npm run build:web
        env:
          EXPO_NO_TELEMETRY: "1"
          NODE_OPTIONS: "--experimental-vm-modules --preserve-symlinks"
          NODE_PATH: "./node_modules"

      - name: Create WASM Package
        run: |
          cd build/emscripten
          zip -r ../../colibri-wasm.zip ./*
          cd ../..

      - name: Upload WASM
        uses: actions/upload-artifact@v4
        with:
          name: c4-wasm
          path: colibri-wasm.zip

      - name: Set package version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          echo "Setting version to $TAG_VERSION in package.json"
          npm version $TAG_VERSION --no-git-tag-version
        working-directory: build/emscripten

      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        working-directory: build/emscripten

  colibri-tor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build colibri-tor
        run: |
          npm install
          npx tsc
        working-directory: bindings/emscripten/packages/tor

      - name: Test colibri-tor
        run: npm test
        working-directory: bindings/emscripten/packages/tor

      - name: Set colibri-tor version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          echo "Setting colibri-tor version to $TAG_VERSION"
          npm version $TAG_VERSION --no-git-tag-version
        working-directory: bindings/emscripten/packages/tor

      - name: Publish colibri-tor to npm
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        working-directory: bindings/emscripten/packages/tor

  colibri-explainer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build colibri-explainer
        run: |
          npm install
          npx tsc
        working-directory: bindings/emscripten/packages/explainer

      - name: Test colibri-explainer
        run: npm test
        working-directory: bindings/emscripten/packages/explainer

      - name: Set colibri-explainer version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          echo "Setting colibri-explainer version to $TAG_VERSION"
          npm version $TAG_VERSION --no-git-tag-version
        working-directory: bindings/emscripten/packages/explainer

      - name: Publish colibri-explainer to npm
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        working-directory: bindings/emscripten/packages/explainer

  docker-playground:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history + tags so `git describe` can derive the version that is
          # passed into the image build (the build context itself has no .git).
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          # colibri sends its build version to the remote prover. Clients below
          # 3.0.0 are forwarded to the v2 prover, whose SSZ proofs this image
          # cannot verify. A full checkout describes as 3.x and is kept; a
          # missing or pre-3 version is rewritten to 3.0.0.
          VERSION="$(git describe --tags --always --dirty)"
          # Require a dotted version. A bare commit hash has no dot; its leading
          # digits are not a major component.
          if printf '%s' "$VERSION" | grep -Eq '^[vV]?[0-9]+\.[0-9]+'; then
            MAJOR="$(printf '%s' "$VERSION" | sed -E 's/^v//; s/[^0-9].*$//')"
          else
            MAJOR=""
          fi
          if [ -z "$MAJOR" ] || [ "$MAJOR" -lt 3 ]; then
            echo "git describe gave '$VERSION' (major='$MAJOR'); forcing C4_VERSION=3.0.0"
            VERSION="3.0.0"
          fi
          echo "Using C4_VERSION=$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: ${{ inputs.push_image }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/corpus-core/colibri-explainer-playground
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ inputs.ref_type == 'tag' && startsWith(inputs.ref_name, 'v') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: bindings/docker/Dockerfile.playground
          build-args: |
            C4_VERSION=${{ steps.version.outputs.version }}
          # Single-arch is enough: the image is just nginx serving static files,
          # so the content is architecture-independent (unlike the prover).
          platforms: linux/amd64
          push: ${{ inputs.push_image }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=playground
          cache-to: type=gha,mode=max,scope=playground
          # Disable provenance/attestation to avoid GHCR upload issues
          provenance: false
          sbom: false
