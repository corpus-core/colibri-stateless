name: Emscripten CI

on:
  workflow_call:
    secrets:
      NPM_TOKEN:
        required: false

permissions:
  contents: write # Required for creating releases and uploading assets
  checks: write
  pull-requests: write
  actions: read

jobs:

  emscripten:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.3

      - name: Build with Emscripten (Split WASM for npm)
        run: |
          emcmake cmake -B build -DWASM=true -DWASM_EMBED=OFF -DCLI=false -DTEST=false -DCURL=false -DCMAKE_BUILD_TYPE=MINSIZREL -S .
          cmake --build build

      - name: Run unit tests (node) + webpack build
        run: |
          cd bindings/emscripten
          npm test
          cd ../../

      - name: Run integration tests (real infrastructure)
        run: |
          cd bindings/emscripten
          npm run test:integration || exit 0 # Ignore integration tests for now
          cd ../../

      - name: Run CCIP tests (real infrastructure)
        run: |
          cd bindings/emscripten
          npm run test:ccip
          cd ../../
  
      - name: RN-web smoke (Expo) tests
        run: |
          cd bindings/emscripten/test/rn-web
          npm install
          npm test
          npm run build:web
        env:
          EXPO_NO_TELEMETRY: "1"
          NODE_OPTIONS: "--experimental-vm-modules --preserve-symlinks"
          NODE_PATH: "./node_modules"

      - name: Create WASM Package
        run: |
          cd build/emscripten
          zip -r ../../colibri-wasm.zip ./*
          cd ../..

      - name: Upload WASM
        uses: actions/upload-artifact@v4
        with:
          name: c4-wasm
          path: colibri-wasm.zip

      - name: Set package version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          echo "Setting version to $TAG_VERSION in package.json"
          npm version $TAG_VERSION --no-git-tag-version
        working-directory: build/emscripten

      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        working-directory: build/emscripten

  colibri-tor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build colibri-tor
        run: |
          npm install
          npx tsc
        working-directory: bindings/emscripten/packages/tor

      - name: Test colibri-tor
        run: npm test
        working-directory: bindings/emscripten/packages/tor

      - name: Set colibri-tor version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          echo "Setting colibri-tor version to $TAG_VERSION"
          npm version $TAG_VERSION --no-git-tag-version
        working-directory: bindings/emscripten/packages/tor

      - name: Publish colibri-tor to npm
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        working-directory: bindings/emscripten/packages/tor
