[package]
name = "kona_bridge"
version = "0.2.0"
edition = "2021"

# Pinned to kona tag `kona-node/v1.2.8` (fe6dfcf7).
# Wires the split crates (kona-disc / kona-gossip / kona-peers / kona-registry) on
# alloy 1.x + libp2p 0.56 + discv5 0.10.2 directly, without kona-node-service.
#
# Rationale for bypassing `kona-node-service`:
#   * It transitively depends on `rollup-boost` (via `kona-engine` / `kona-rpc`),
#     whose build script fails under the current `vergen-git2` / `vergen-lib`
#     version graph.
#   * Its `NetworkActor` / `NetworkDriver` only expose `OpExecutionPayloadEnvelope`
#     on the `blocks` channel — the P2P `.signature` bytes are dropped in the
#     `OpNetworkPayloadEnvelope -> OpExecutionPayloadEnvelope` conversion.
#     Colibri needs that signature (written into `.raw` preconf files), so we
#     drive `GossipDriver` / `Discv5Driver` ourselves in `gossip.rs`.
[dependencies]
# `k256` is retained because `alloy_primitives::Signature` uses the k256 backend
# for the encoded-v accessor we rely on in `utils.rs::signature_to_bytes`.
alloy-primitives = { version = "1.4.1", features = ["k256"] }

kona-disc = { git = "https://github.com/op-rs/kona", tag = "kona-node/v1.2.8" }
kona-gossip = { git = "https://github.com/op-rs/kona", tag = "kona-node/v1.2.8" }
kona-peers = { git = "https://github.com/op-rs/kona", tag = "kona-node/v1.2.8" }
kona-registry = { git = "https://github.com/op-rs/kona", tag = "kona-node/v1.2.8" }

op-alloy-rpc-types-engine = "0.22.4"

libp2p = { version = "0.56", features = ["macros", "tokio", "tcp", "noise", "gossipsub", "ping"] }
discv5 = "0.10.2"
tokio = { version = "1.44.2", features = ["full"] }
axum = "0.8.3"
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"

tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1.0.85"
clap = { version = "4.5.4", features = ["derive", "env"] }

zstd = "0.13"
tempfile = "3.0"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
md5 = "0.7"
anyhow = "1"

[[bin]]
name = "kona-preconf-service"
path = "src/main.rs"

[lib]
name = "kona_bridge"
crate-type = ["staticlib", "rlib"]

[features]
default = []
ffi = []
