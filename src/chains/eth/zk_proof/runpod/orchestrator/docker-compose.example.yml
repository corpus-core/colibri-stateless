# docker-compose.example.yml - deployment template for the RunPod orchestrator.
#
# Runs on the Colibri prover server next to the existing daemon. It mounts the
# same period-store docker volume that the server (and the current
# scripts/build_proof workflow) reads/writes.
#
# Copy this file to `docker-compose.yml`, fill in the placeholders below, and
# start with `docker compose up -d --build`.
#
# You need three RunPod credentials on hand (from https://runpod.io/console):
#   - a REST API key (used to create / terminate GPU pods)
#   - an S3 access key + secret key pair for the network volume
#   - the network-volume id (visible in the RunPod Storage page)
#
# =============================================================================
# CREDENTIAL HANDLING
# =============================================================================
#
# Local / staging: put the four RunPod secrets into a plain `.env` file at the
# repository root and let the `env_file:` block below load them. Docker Compose
# picks the file up automatically when you `docker compose up` from this
# directory. The `.env` file is gitignored - never commit real credentials.
#
# Repo-root .env should look like this:
#
#   RUNPOD_API_KEY=rpa_...
#   RUNPOD_S3_ACCESS_KEY=user_...
#   RUNPOD_S3_SECRET_KEY=rps_...
#   NETWORK_VOLUME_ID=...
#   RUNPOD_DATACENTER=EU-RO-1
#
# Production: comment out the `env_file:` block, enable the `secrets:` block at
# the bottom and the matching `<NAME>_FILE` entries in `environment:` below.
# `orchestrator.js` transparently resolves any `<NAME>_FILE` variable by
# reading the referenced path (see the `requireEnv` helper in orchestrator.js).
# That keeps the raw secret out of `docker inspect` and `/proc/<pid>/environ`.

services:
  zkproof-runpod-orchestrator:
    build:
      # Build context is the repository root so the Dockerfile can COPY the
      # orchestrator sources plus the docker sub-tree it lives in.
      context: ../../../../../..
      dockerfile: src/chains/eth/zk_proof/runpod/orchestrator/Dockerfile
    image: zkprover-runpod-orchestrator:latest
    restart: unless-stopped

    # ------------------------------------------------------------------
    # LOCAL: load RunPod credentials from the repo-root .env file.
    # Comment this block out in production and enable the `secrets:`
    # block at the bottom of this file instead.
    # ------------------------------------------------------------------
    env_file:
      - ../../../../../../.env

    environment:
      # Which chain to service. Must match the docker-volume you mount below.
      CHAIN: mainnet

      # The prover-gpu image (Image 2). Built and published to GHCR by the
      # `Docker Prover GPU (RunPod)` workflow (see
      # .github/workflows/prover-gpu-docker.yml) on every push to the `v5_pod`
      # branch. Since this is a temporary, branch-local pipeline we track the
      # `latest` tag instead of a version tag.
      RUNPOD_IMAGE: "ghcr.io/corpus-core/colibri-prover-gpu:latest"

      # GPU selection. Multiple types can be given comma-separated. Any GPU
      # with >=24 GB VRAM and CUDA Compute Capability >= 8.6 works for SP1 v5.
      RUNPOD_GPU_TYPES: "NVIDIA GeForce RTX 4090,NVIDIA RTX A6000,NVIDIA L40S"

      # How often to scan the volume, and how long to wait for a single proof
      # before giving up on the pod.
      CHECK_INTERVAL_MS: "600000"    # 10 minutes
      JOB_TIMEOUT_MS: "3600000"      # 60 minutes
      POLL_INTERVAL_MS: "15000"      # 15 seconds

      # Docker-volume mount path inside this container.
      OUTPUT_DIR: /data

      # ------------------------------------------------------------------
      # PRODUCTION (docker secrets): uncomment the block below AND the
      # top-level `secrets:` section, and comment out the `env_file:`
      # block above. orchestrator.js reads the file at the referenced
      # path via `requireEnv(<NAME>)` -> `<NAME>_FILE`.
      # ------------------------------------------------------------------
      # RUNPOD_API_KEY_FILE:        /run/secrets/runpod_api_key
      # RUNPOD_S3_ACCESS_KEY_FILE:  /run/secrets/runpod_s3_access_key
      # RUNPOD_S3_SECRET_KEY_FILE:  /run/secrets/runpod_s3_secret_key
      # NETWORK_VOLUME_ID_FILE:     /run/secrets/runpod_volume_id
      # RUNPOD_DATACENTER_FILE:     /run/secrets/runpod_datacenter

    volumes:
      # Mount the existing docker volume that the Colibri server reads from.
      # This is the same volume that `scripts/build_proof` accesses today via
      # `ssh <server> "docker run -v <volume>:/data alpine ..."`.
      #
      # Replace the volume name to match your chain (e.g. gnosis_blocks).
      - mainnet_blocks:/data

    # ------------------------------------------------------------------
    # PRODUCTION: mount secrets into the container's filesystem.
    # ------------------------------------------------------------------
    # secrets:
    #   - runpod_api_key
    #   - runpod_s3_access_key
    #   - runpod_s3_secret_key
    #   - runpod_volume_id
    #   - runpod_datacenter

volumes:
  mainnet_blocks:
    external: true

# ------------------------------------------------------------------
# PRODUCTION: define the docker secrets. Use either `file:` (bind a
# file that only root can read) or `external: true` (managed via
# `docker secret create ...` in swarm mode).
# ------------------------------------------------------------------
# secrets:
#   runpod_api_key:
#     file: /etc/colibri/secrets/runpod_api_key
#   runpod_s3_access_key:
#     file: /etc/colibri/secrets/runpod_s3_access_key
#   runpod_s3_secret_key:
#     file: /etc/colibri/secrets/runpod_s3_secret_key
#   runpod_volume_id:
#     file: /etc/colibri/secrets/runpod_volume_id
#   runpod_datacenter:
#     file: /etc/colibri/secrets/runpod_datacenter
