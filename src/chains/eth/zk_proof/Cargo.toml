[workspace]
members = ["program", "script", "common", "export_vk"]
resolver = "2"

[workspace.dependencies]
sp1-zkvm = { version = "6.3.0" }
sp1-sdk = { version = "6.3.0", features = ["network"] }
# `bits` (ff/bits / PrimeFieldBits) is disabled: it is unused by our code and its
# bitvec-based code path does not compile under the SP1 v6 patch. The zkVM precompile
# replaces scalar arithmetic, so `bits` is not needed. `program` adds `experimental`
# (hash-to-curve) on top of these features.
bls12_381 = { version = "0.8.0", default-features = false, features = ["groups", "pairings", "alloc"] }
sha2 = "0.9.9"
serde = { version = "1.0", features = ["derive"] }
hex = "0.4"
bincode = "1.3"
typenum = "1.17"
generic-array = "0.14"
byteorder = "1.5"

[patch.crates-io]
sha2 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha2", tag = "patch-sha2-0.9.9-sp1-6.0.0" }
# Use the "-v2" patch variant: it provides `hash_to_curve(impl AsRef<[u8]>, dst)` and
# `digest = 0.9` (compatible with our `sha2 = 0.9.9`), matching the working v5 setup
# (which used `patch-0.8.0-sp1-5.0.0-v2`). The non-v2 crates.io variant uses `digest 0.10`
# and a different iterator-based `Message` API that our `program/src/bls.rs` does not use.
bls12_381 = { git = "https://github.com/sp1-patches/bls12_381", tag = "patch-0.8.0-sp1-6.0.0-v2" }
