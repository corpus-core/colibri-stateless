[package]
name = "eth-sync-script"
version = "0.1.0"
edition = "2021"

[features]
default = []
# Enable the SP1 CUDA prover. When this feature is on the host binary can
# additionally build a CudaProver that connects to an externally-hosted
# Moongate server via `SP1_MOONGATE_ENDPOINT` (avoids docker-in-docker in
# GPU containers such as the RunPod prover image).
cuda = ["sp1-sdk/cuda"]

[dependencies]
sp1-sdk = { workspace = true }
sp1-stark = "=5.2.3"
sp1-prover = "=5.2.3"
eth-sync-common = { path = "../common" }
serde = { workspace = true }
hex = { workspace = true }
bincode = { workspace = true }
clap = { version = "4.0", features = ["derive"] }
tokio = { version = "1.0", features = ["full"] }
sha2 = "0.10"
k256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"

[build-dependencies]
# sp1-helper = { git = "https://github.com/succinctlabs/sp1.git" } # Removed as unused and causing conflicts

[[bin]]
name = "eth-sync-script"
path = "src/main.rs"
