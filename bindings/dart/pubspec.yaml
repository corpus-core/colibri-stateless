name: colibri_stateless
description: Dart bindings for Colibri Stateless via FFI (proof generation and verification for Ethereum RPC).
version: 0.1.9
repository: https://github.com/corpus-core/colibri-stateless
homepage: https://corpus-core.gitbook.io/specification-colibri-stateless
documentation: https://github.com/corpus-core/colibri-stateless
issue_tracker: https://github.com/corpus-core/colibri-stateless/issues

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  colibri_stateless_ffi:
    path: ffi
  http: ^1.2.0
  web: ^1.0.0

dev_dependencies:
  coverage: ^1.15.0
  lints: ^3.0.0
  test: ^1.29.0
