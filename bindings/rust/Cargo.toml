[package]
name = "colibri-stateless"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["corpus.core <office@corpus.core>", "Colibri Contributors"]
description = "Rust bindings for Colibri Stateless -- a stateless prover/verifier for Ethereum and OP-Stack chains."
license = "MIT"
repository = "https://github.com/corpus-core/colibri-stateless"
homepage = "https://github.com/corpus-core/colibri-stateless"
documentation = "https://docs.rs/colibri-stateless"
readme = "README.md"
keywords = ["ethereum", "prover", "verifier", "light-client", "stateless"]
categories = ["cryptography::cryptocurrencies", "api-bindings", "no-std::no-alloc"]
# Keep the crate on crates.io small: ship only the wrapper sources, the Rust
# code and the docs. Native library + third-party sources live in the repo and
# are fetched by `build.rs` (either via CMake in dev mode or via prebuilt
# archives from GitHub Releases in the published mode).
include = [
    "src/**/*.rs",
    "build.rs",
    "Cargo.toml",
    "README.md",
    "doc.md",
    "LICENSE",
    "wrapper.h",
]

[features]
# Enable the OP-Stack verifier/prover in the underlying C core. On by default
# so verifying Base / OP Mainnet / other OP-Stack rollups works out of the
# box. Disable with `--no-default-features` for Ethereum-only consumers who
# want to avoid pulling the OP module into their binary.
default = ["op", "prover"]
op = []
# The prover: `Prover`, `Colibri::create_proof`, and in the CMake build the
# prover libraries. On by default. Without it (`default-features = false`)
# the C core is built with `PROVER=OFF`: it only verifies, the RPC context
# takes proofs from a remote prover (remote or proxy mode) and never proves
# locally, also not when the remote prover fails. Like `op`, it only
# changes the CMake build; prebuilt and `COLIBRI_LIB_DIR` archives are
# linked as they are.
prover = []

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", default-features = false, features = ["rt", "sync", "macros", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
thiserror = "2"
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
async-trait = "0.1"

[build-dependencies]
cmake = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tempfile = "3"
serial_test = "3"

[[example]]
name = "rpc"
path = "examples/rpc.rs"

[[example]]
name = "storage"
path = "examples/storage.rs"

[[test]]
name = "proof_roundtrip"
path = "tests/proof_roundtrip.rs"
required-features = ["prover"]

[package.metadata.docs.rs]
# docs.rs cannot build the native library (no network, sandboxed). Skip the
# native build via the DOCS_RS env var and only produce documentation.
rustdoc-args = ["--cfg", "docsrs"]
no-default-features = true
features = ["prover"]
